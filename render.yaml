# FREE PREVIEW ONLY: data is temporary and all external AI/channel providers are simulated.
# Keep live YouTube credentials and production data out of this preview service.
services:
  - type: web
    name: tubeautonomy-preview
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: demo
      - key: OWNER_TOKEN
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: YOUTUBE_PROVIDER
        value: mock
      - key: TTS_PROVIDER
        value: mock
      - key: DISABLE_SCHEDULER
        value: "1"
      - key: PORT
        value: "10000"
