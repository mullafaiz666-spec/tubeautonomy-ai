name: Test TubeVerse Tools

on:
  push:
    branches: [tubeverse-actions]
    paths:
      - 'renderer/**'
      - 'publisher/**'
      - 'autonomy/**'
      - 'scripts/**'
      - '.github/workflows/autonomous-content-factory.yml'
      - '.github/workflows/autonomous-youtube-publish.yml'
      - '.github/workflows/autonomy-learning.yml'
      - '.github/workflows/render-tubeverse-video.yml'
      - '.github/workflows/test-tubeverse-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tubeverse-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tubeverse-actions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python tools
        run: |
          python -m py_compile renderer/*.py publisher/*.py autonomy/*.py
      - name: Validate shell setup scripts
        run: bash -n scripts/*.sh
      - name: Test deterministic scene planner
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'renderer')
          from scene_plan import build_plan, keywords
          plan = build_plan('AI video systems create scenes. Video systems then render results.', 6)
          assert len(plan) == 2, plan
          assert 'video' in keywords('video video AI'), keywords('video video AI')
          assert plan[0]['keywords'], plan
          print(plan)
          PY
      - name: Test visual worker fallback without GPU secrets
        run: |
          mkdir -p /tmp/tubeverse-generated
          printf '%s\n' '{"scenes":[{"index":1,"visualPrompt":"original futuristic newsroom"}]}' > /tmp/scene-plan.json
          python renderer/generative_media.py /tmp/scene-plan.json /tmp/tubeverse-generated
          python - <<'PY'
          import json
          data=json.load(open('/tmp/tubeverse-generated/manifest.json'))
          assert data['enabled'] is False, data
          assert data['generated'] == 0, data
          print(data)
          PY
      - name: Test manual render cannot become autonomous publish signal
        run: |
          printf '%s\n' '{"title":"Manual Test","script":"This is a manual render and must never auto publish."}' > /tmp/manual-job.json
          python autonomy/qa_gate.py /tmp/manual-job.json /tmp/not-needed.json /tmp/not-needed-probe.json --report /tmp/manual-qa.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/manual-qa.json'))
          assert data['skipped'] is True, data
          assert data['eligibleForAutoPublish'] is False, data
          assert data['passed'] is False, data
          print(data)
          PY
      - name: Verify autonomous safety gates
        run: |
          grep -q 'ORIGINALITY_SEMANTIC_MAX' autonomy/pipeline.py
          grep -q 'originalityPassed' autonomy/qa_gate.py
          grep -q 'eligibleForAutoPublish' autonomy/qa_gate.py
          grep -q 'source.*tubeautonomy-autopilot' autonomy/pipeline.py
          grep -q 'autonomy-trigger' .github/workflows/autonomous-content-factory.yml
          grep -q 'workflow_call' .github/workflows/render-tubeverse-video.yml
          grep -q -- '--confirm-upload' .github/workflows/render-tubeverse-video.yml
          grep -q 'publishing-history' .github/workflows/render-tubeverse-video.yml
          grep -q 'channel-performance.json' .github/workflows/autonomy-learning.yml
      - name: Verify publisher safety defaults
        run: |
          grep -q -- '--confirm-upload' publisher/youtube_upload.py
          grep -q 'default="private"' publisher/youtube_upload.py
          grep -q '1280, 720' publisher/thumbnail.py
