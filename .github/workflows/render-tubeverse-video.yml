name: TubeVerse Render Video

on:
  push:
    branches: [tubeverse-actions]
    paths:
      - 'render-queue/**.json'
      - 'renderer/**'
      - '.github/workflows/render-tubeverse-video.yml'
  workflow_dispatch:
    inputs:
      job_file:
        description: Render job JSON path
        required: true
        default: render-queue/demo-001.json

permissions:
  contents: read

concurrency:
  group: tubeverse-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MPT_COMMIT: cf5a3aedad1741d012152d355aa909d224fc4557
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tubeverse-actions

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig libgl1 espeak-ng
          python -m pip install --upgrade pip uv

      - name: Install TubeVerse AI tools
        run: |
          # This runner is CPU-only. Install CPU PyTorch first so Kokoro does not
          # pull multi-gigabyte CUDA wheels that can never be used here.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'kokoro>=0.9.4' soundfile 'faster-whisper>=1.1.0' yt-dlp
          python - <<'PY'
          import importlib.metadata as m
          import torch
          print('torch', torch.__version__, 'cuda_available', torch.cuda.is_available())
          for pkg in ['kokoro','faster-whisper','yt-dlp','soundfile']:
              print(pkg, m.version(pkg))
          PY

      - name: Resolve render job and build scene plan
        id: job
        shell: bash
        run: |
          set -euo pipefail
          JOB_FILE='${{ github.event.inputs.job_file }}'
          if [ -z "$JOB_FILE" ]; then
            JOB_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^render-queue/.*\.json$' | head -n1 || true)"
          fi
          if [ -z "$JOB_FILE" ]; then JOB_FILE='render-queue/demo-001.json'; fi
          test -f "$JOB_FILE"
          echo "job_file=$JOB_FILE" >> "$GITHUB_OUTPUT"
          rm -rf work/job output .runtime/MoneyPrinterTurbo
          mkdir -p work/job output .runtime
          python renderer/prepare_job.py "$JOB_FILE" work/job
          ASPECT="$(python - <<'PY'
          import json
          print(json.load(open('work/job/meta.json'))['aspectRatio'])
          PY
          )"
          echo "aspect=$ASPECT" >> "$GITHUB_OUTPUT"

      - name: Fetch optional owned or licensed media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/job/media
          python renderer/fetch_media.py '${{ steps.job.outputs.job_file }}' work/job/media

      - name: Source open-license Commons visuals
        shell: bash
        run: |
          set +e
          mkdir -p work/job/commons
          python renderer/commons_media.py work/job/scene-plan.json work/job/meta.json work/job/commons
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo 'Wikimedia Commons sourcing was unavailable; deterministic TubeVerse scene cards remain available.'
          fi

      - name: Generate local Kokoro narration
        id: voice
        shell: bash
        run: |
          set +e
          python renderer/kokoro_tts.py work/job/script.txt work/job/voice.wav --voice af_heart --lang a --speed 1.0
          status=$?
          set -e
          if [ "$status" -eq 0 ] && [ -s work/job/voice.wav ]; then
            echo "engine=kokoro" >> "$GITHUB_OUTPUT"
            echo "audio=$GITHUB_WORKSPACE/work/job/voice.wav" >> "$GITHUB_OUTPUT"
            ffprobe -v error -show_entries format=duration,size -of json work/job/voice.wav | tee output/voice-ffprobe.json
          else
            echo 'Kokoro failed; falling back to MoneyPrinterTurbo Edge TTS.'
            rm -f work/job/voice.wav
            echo "engine=edge" >> "$GITHUB_OUTPUT"
            echo "audio=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch pinned MoneyPrinterTurbo engine
        run: |
          git clone --filter=blob:none https://github.com/harry0703/MoneyPrinterTurbo.git .runtime/MoneyPrinterTurbo
          cd .runtime/MoneyPrinterTurbo
          git checkout "$MPT_COMMIT"
          git rev-parse HEAD

      - name: Install MoneyPrinterTurbo
        working-directory: .runtime/MoneyPrinterTurbo
        run: |
          uv sync --frozen

      - name: Render real MP4
        shell: bash
        working-directory: .runtime/MoneyPrinterTurbo
        run: |
          set -euo pipefail
          TITLE="$(cat "$GITHUB_WORKSPACE/work/job/title.txt")"
          SCRIPT="$(cat "$GITHUB_WORKSPACE/work/job/script.txt")"
          FALLBACK="$GITHUB_WORKSPACE/work/job/background.mp4"

          mapfile -t EXPLICIT_MEDIA < <(find "$GITHUB_WORKSPACE/work/job/media" -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.mov' -o -name '*.mkv' -o -name '*.webm' \) -print | sort)
          mapfile -t COMMONS_MEDIA < <(find "$GITHUB_WORKSPACE/work/job/commons" -maxdepth 1 -type f -name '*.mp4' -print 2>/dev/null | sort)

          if [ "${#EXPLICIT_MEDIA[@]}" -gt 0 ]; then
            MATERIALS="$(IFS=,; echo "${EXPLICIT_MEDIA[*]}")"
            echo "Using ${#EXPLICIT_MEDIA[@]} operator-supplied owned/licensed media file(s)."
          elif [ "${#COMMONS_MEDIA[@]}" -gt 0 ]; then
            MATERIALS="$(IFS=,; echo "${COMMONS_MEDIA[*]}")"
            echo "Using ${#COMMONS_MEDIA[@]} open-license Wikimedia Commons scene clip(s)."
          else
            MATERIALS="$FALLBACK"
            echo 'Using TubeVerse scene-card fallback material.'
          fi

          ARGS=(
            --video-subject "$TITLE"
            --video-script "$SCRIPT"
            --video-source local
            --video-materials "$MATERIALS"
            --video-aspect '${{ steps.job.outputs.aspect }}'
            --video-concat-mode sequential
            --video-transition-mode fade-in
            --bgm-type none
            --subtitle-enabled
            --subtitle-position bottom
            --font-size 46
            --n-threads 2
            --stop-at video
          )
          if [ -s "$GITHUB_WORKSPACE/work/job/voice.wav" ]; then
            ARGS+=(--custom-audio-file "$GITHUB_WORKSPACE/work/job/voice.wav")
          else
            ARGS+=(--voice-name 'en-US-JennyNeural-Female')
          fi

          uv run python cli.py "${ARGS[@]}" | tee "$GITHUB_WORKSPACE/output/mpt-result.json"

          VIDEO="$(find storage/tasks -type f -name '*.mp4' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$VIDEO"
          test -s "$VIDEO"
          cp "$VIDEO" "$GITHUB_WORKSPACE/output/tubeverse-video.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of json "$GITHUB_WORKSPACE/output/tubeverse-video.mp4" | tee "$GITHUB_WORKSPACE/output/ffprobe.json"

      - name: Transcribe and QA finished render with faster-whisper
        run: |
          python renderer/qa_transcribe.py output/tubeverse-video.mp4 output/qa-transcript.json --srt output/qa-transcript.srt --model tiny.en

      - name: Verify output
        run: |
          test -s output/tubeverse-video.mp4
          test -s output/qa-transcript.json
          python - <<'PY'
          import json, pathlib
          probe=json.loads(pathlib.Path('output/ffprobe.json').read_text())
          qa=json.loads(pathlib.Path('output/qa-transcript.json').read_text())
          duration=float(probe['format']['duration'])
          size=int(probe['format']['size'])
          assert duration > 1, duration
          assert size > 10000, size
          assert qa['wordCount'] >= 3, qa['wordCount']
          print({'duration':duration,'size':size,'transcribedWords':qa['wordCount']})
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tubeverse-video-${{ github.run_number }}
          path: |
            output/tubeverse-video.mp4
            output/mpt-result.json
            output/ffprobe.json
            output/qa-transcript.json
            output/qa-transcript.srt
            output/voice-ffprobe.json
            work/job/scene-plan.json
            work/job/meta.json
            work/job/commons/attribution.json
          if-no-files-found: warn
          retention-days: 7
