name: TubeVerse Render Video

on:
  workflow_call:
    inputs:
      job_file:
        description: Render job JSON path
        required: false
        type: string
  push:
    branches: [tubeverse-actions]
    paths:
      - 'render-queue/**.json'
      - 'renderer/**'
  workflow_dispatch:
    inputs:
      job_file:
        description: Render job JSON path
        required: true
        default: render-queue/demo-001.json

permissions:
  contents: read

concurrency:
  group: tubeverse-render-${{ github.ref }}-${{ inputs.job_file || 'branch' }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      autonomous: ${{ steps.job.outputs.autonomous }}
    env:
      MPT_COMMIT: cf5a3aedad1741d012152d355aa909d224fc4557
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'tubeverse-actions' }}
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig libgl1 espeak-ng
          python -m pip install --upgrade pip uv

      - name: Install TubeVerse AI tools
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'kokoro>=0.9.4' soundfile 'faster-whisper>=1.1.0' yt-dlp
          python - <<'PY'
          import importlib.metadata as m
          import torch
          print('torch', torch.__version__, 'cuda_available', torch.cuda.is_available())
          for pkg in ['kokoro','faster-whisper','yt-dlp','soundfile']:
              print(pkg, m.version(pkg))
          PY

      - name: Resolve render job and build scene plan
        id: job
        shell: bash
        run: |
          set -euo pipefail
          JOB_FILE='${{ inputs.job_file }}'
          if [ -z "$JOB_FILE" ]; then
            JOB_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^render-queue/.*\.json$' | head -n1 || true)"
          fi
          if [ -z "$JOB_FILE" ]; then JOB_FILE='render-queue/demo-001.json'; fi
          test -f "$JOB_FILE"
          echo "Resolved render job: $JOB_FILE"
          echo "job_file=$JOB_FILE" >> "$GITHUB_OUTPUT"
          AUTONOMOUS="$(python - "$JOB_FILE" <<'PY'
          import json,sys
          job=json.load(open(sys.argv[1], encoding='utf-8'))
          print('true' if job.get('source') == 'tubeautonomy-autopilot' else 'false')
          PY
          )"
          echo "autonomous=$AUTONOMOUS" >> "$GITHUB_OUTPUT"
          rm -rf work/job output .runtime/MoneyPrinterTurbo
          mkdir -p work/job output .runtime
          python renderer/prepare_job.py "$JOB_FILE" work/job
          ASPECT="$(python - <<'PY'
          import json
          print(json.load(open('work/job/meta.json'))['aspectRatio'])
          PY
          )"
          echo "aspect=$ASPECT" >> "$GITHUB_OUTPUT"

      - name: Fetch optional owned or licensed media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/job/media
          python renderer/fetch_media.py '${{ steps.job.outputs.job_file }}' work/job/media

      - name: Generate scene visuals with ComfyUI or LTX when configured
        shell: bash
        env:
          COMFYUI_URL: ${{ secrets.COMFYUI_URL }}
          COMFYUI_API_TOKEN: ${{ secrets.COMFYUI_API_TOKEN }}
          COMFYUI_WORKFLOW_JSON: ${{ secrets.COMFYUI_WORKFLOW_JSON }}
          COMFYUI_PROMPT_NODE: ${{ vars.COMFYUI_PROMPT_NODE }}
          COMFYUI_TIMEOUT_SECONDS: ${{ vars.COMFYUI_TIMEOUT_SECONDS || '420' }}
          COMFYUI_SCENE_SECONDS: ${{ vars.COMFYUI_SCENE_SECONDS || '7' }}
        run: |
          set +e
          mkdir -p work/job/generated
          python renderer/generative_media.py work/job/scene-plan.json work/job/generated \
            --aspect '${{ steps.job.outputs.aspect }}' \
            --manifest work/job/generated/manifest.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo 'Generative visual worker failed; continuing with licensed/fallback visuals.'
          fi

      - name: Source open-license Commons visuals
        shell: bash
        run: |
          set +e
          mkdir -p work/job/commons
          python renderer/commons_media.py work/job/scene-plan.json work/job/meta.json work/job/commons
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo 'Wikimedia Commons sourcing was unavailable; deterministic TubeVerse scene cards remain available.'
          fi

      - name: Generate local Kokoro narration
        id: voice
        shell: bash
        run: |
          set +e
          python renderer/kokoro_tts.py work/job/script.txt work/job/voice.wav --voice af_heart --lang a --speed 1.0
          status=$?
          set -e
          if [ "$status" -eq 0 ] && [ -s work/job/voice.wav ]; then
            echo "engine=kokoro" >> "$GITHUB_OUTPUT"
            echo "audio=$GITHUB_WORKSPACE/work/job/voice.wav" >> "$GITHUB_OUTPUT"
            ffprobe -v error -show_entries format=duration,size -of json work/job/voice.wav | tee output/voice-ffprobe.json
          else
            echo 'Kokoro failed; falling back to MoneyPrinterTurbo Edge TTS.'
            rm -f work/job/voice.wav
            echo "engine=edge" >> "$GITHUB_OUTPUT"
            echo "audio=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch pinned MoneyPrinterTurbo engine
        run: |
          git clone --filter=blob:none https://github.com/harry0703/MoneyPrinterTurbo.git .runtime/MoneyPrinterTurbo
          cd .runtime/MoneyPrinterTurbo
          git checkout "$MPT_COMMIT"
          git rev-parse HEAD

      - name: Install MoneyPrinterTurbo
        working-directory: .runtime/MoneyPrinterTurbo
        run: uv sync --frozen

      - name: Render real MP4
        shell: bash
        working-directory: .runtime/MoneyPrinterTurbo
        run: |
          set -euo pipefail
          TITLE="$(cat "$GITHUB_WORKSPACE/work/job/title.txt")"
          SCRIPT="$(cat "$GITHUB_WORKSPACE/work/job/script.txt")"
          FALLBACK="$GITHUB_WORKSPACE/work/job/background.mp4"

          mapfile -t EXPLICIT_MEDIA < <(find "$GITHUB_WORKSPACE/work/job/media" -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.mov' -o -name '*.mkv' -o -name '*.webm' \) -print | sort)
          mapfile -t GENERATED_MEDIA < <(find "$GITHUB_WORKSPACE/work/job/generated" -maxdepth 1 -type f -name 'scene-*.mp4' -print 2>/dev/null | sort)
          mapfile -t COMMONS_MEDIA < <(find "$GITHUB_WORKSPACE/work/job/commons" -maxdepth 1 -type f -name '*.mp4' -print 2>/dev/null | sort)

          if [ "${#EXPLICIT_MEDIA[@]}" -gt 0 ]; then
            MATERIALS="$(IFS=,; echo "${EXPLICIT_MEDIA[*]}")"
            echo "Using ${#EXPLICIT_MEDIA[@]} operator-supplied owned/licensed media file(s)."
          elif [ "${#GENERATED_MEDIA[@]}" -gt 0 ]; then
            MATERIALS="$(IFS=,; echo "${GENERATED_MEDIA[*]}")"
            echo "Using ${#GENERATED_MEDIA[@]} ComfyUI/LTX generated scene clip(s)."
          elif [ "${#COMMONS_MEDIA[@]}" -gt 0 ]; then
            MATERIALS="$(IFS=,; echo "${COMMONS_MEDIA[*]}")"
            echo "Using ${#COMMONS_MEDIA[@]} open-license Wikimedia Commons scene clip(s)."
          else
            MATERIALS="$FALLBACK"
            echo 'Using TubeVerse scene-card fallback material.'
          fi

          ARGS=(
            --video-subject "$TITLE"
            --video-script "$SCRIPT"
            --video-source local
            --video-materials "$MATERIALS"
            --video-aspect '${{ steps.job.outputs.aspect }}'
            --video-concat-mode sequential
            --video-transition-mode fade-in
            --bgm-type none
            --subtitle-enabled
            --subtitle-position bottom
            --font-size 46
            --n-threads 2
            --stop-at video
          )
          if [ -s "$GITHUB_WORKSPACE/work/job/voice.wav" ]; then
            ARGS+=(--custom-audio-file "$GITHUB_WORKSPACE/work/job/voice.wav")
          else
            ARGS+=(--voice-name 'en-US-JennyNeural-Female')
          fi

          uv run python cli.py "${ARGS[@]}" | tee "$GITHUB_WORKSPACE/output/mpt-result.json"

          VIDEO="$(find storage/tasks -type f -name '*.mp4' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$VIDEO"
          test -s "$VIDEO"
          cp "$VIDEO" "$GITHUB_WORKSPACE/output/tubeverse-video.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of json "$GITHUB_WORKSPACE/output/tubeverse-video.mp4" | tee "$GITHUB_WORKSPACE/output/ffprobe.json"

      - name: Transcribe and QA finished render with faster-whisper
        run: |
          python renderer/qa_transcribe.py output/tubeverse-video.mp4 output/qa-transcript.json --srt output/qa-transcript.srt --model tiny.en

      - name: Verify output media
        run: |
          test -s output/tubeverse-video.mp4
          test -s output/qa-transcript.json
          python - <<'PY'
          import json, pathlib
          probe=json.loads(pathlib.Path('output/ffprobe.json').read_text())
          qa=json.loads(pathlib.Path('output/qa-transcript.json').read_text())
          duration=float(probe['format']['duration'])
          size=int(probe['format']['size'])
          assert duration > 1, duration
          assert size > 10000, size
          assert qa['wordCount'] >= 3, qa['wordCount']
          print({'duration':duration,'size':size,'transcribedWords':qa['wordCount']})
          PY

      - name: Autonomous publish quality gate
        if: ${{ steps.job.outputs.autonomous == 'true' }}
        run: |
          python autonomy/qa_gate.py '${{ steps.job.outputs.job_file }}' output/qa-transcript.json output/ffprobe.json --report output/autonomy-qa.json

      - name: Mark manual render as not eligible for autonomous publish
        if: ${{ steps.job.outputs.autonomous != 'true' }}
        run: |
          python autonomy/qa_gate.py '${{ steps.job.outputs.job_file }}' output/qa-transcript.json output/ffprobe.json --report output/autonomy-qa.json

      - uses: actions/upload-artifact@v4
        with:
          name: tubeverse-video-${{ github.run_number }}
          path: |
            output/tubeverse-video.mp4
            output/mpt-result.json
            output/ffprobe.json
            output/qa-transcript.json
            output/qa-transcript.srt
            output/voice-ffprobe.json
            output/autonomy-qa.json
            work/job/scene-plan.json
            work/job/meta.json
            work/job/generated/manifest.json
            work/job/commons/attribution.json
            ${{ steps.job.outputs.job_file }}
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: render
    if: ${{ needs.render.outputs.autonomous == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tubeverse-actions
          fetch-depth: 0

      - name: Download machine-verified render
        uses: actions/download-artifact@v4
        with:
          name: tubeverse-video-${{ github.run_number }}
          path: downloaded

      - name: Locate and verify autonomous artifact
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          JOB_FILE="$(find downloaded -type f \( -path '*/render-queue/auto-*.json' -o -name 'auto-*.json' \) | head -n1 || true)"
          VIDEO_FILE="$(find downloaded -type f -name 'tubeverse-video.mp4' | head -n1 || true)"
          QA_FILE="$(find downloaded -type f -name 'autonomy-qa.json' | head -n1 || true)"
          test -n "$JOB_FILE" && test -s "$JOB_FILE"
          test -n "$VIDEO_FILE" && test -s "$VIDEO_FILE"
          test -n "$QA_FILE" && test -s "$QA_FILE"
          python - "$JOB_FILE" "$QA_FILE" <<'PY'
          import json,sys
          job=json.load(open(sys.argv[1]))
          qa=json.load(open(sys.argv[2]))
          assert job.get('source') == 'tubeautonomy-autopilot', job.get('source')
          assert qa.get('passed') is True, qa
          assert qa.get('eligibleForAutoPublish') is True, qa
          assert (job.get('autonomy') or {}).get('originality',{}).get('passed') is True
          PY
          echo "job_file=$JOB_FILE" >> "$GITHUB_OUTPUT"
          echo "video_file=$VIDEO_FILE" >> "$GITHUB_OUTPUT"
          echo "qa_file=$QA_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify YouTube credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID" || { echo 'Missing YOUTUBE_CLIENT_ID'; exit 2; }
          test -n "$YOUTUBE_CLIENT_SECRET" || { echo 'Missing YOUTUBE_CLIENT_SECRET'; exit 2; }
          test -n "$YOUTUBE_REFRESH_TOKEN" || { echo 'Missing YOUTUBE_REFRESH_TOKEN'; exit 2; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install publishing tools
        run: python -m pip install -r publisher/requirements.txt

      - name: Prepare metadata and thumbnail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          python - '${{ steps.meta.outputs.job_file }}' <<'PY'
          import json, pathlib, sys
          job=json.load(open(sys.argv[1]))
          pathlib.Path('publish/title.txt').write_text(str(job['title'])[:100], encoding='utf-8')
          pathlib.Path('publish/description.txt').write_text(str(job.get('description',''))[:5000], encoding='utf-8')
          pathlib.Path('publish/tags.txt').write_text(','.join(str(x) for x in job.get('tags',[])[:30]), encoding='utf-8')
          pathlib.Path('publish/thumb.txt').write_text(str(job.get('thumbnailText') or job['title'])[:95], encoding='utf-8')
          PY
          python publisher/thumbnail.py --title "$(cat publish/thumb.txt)" --output publish/thumbnail.jpg

      - name: Publish to YouTube after machine verification
        shell: bash
        run: |
          set -euo pipefail
          python publisher/youtube_upload.py '${{ steps.meta.outputs.video_file }}' \
            --title "$(cat publish/title.txt)" \
            --description "$(cat publish/description.txt)" \
            --tags "$(cat publish/tags.txt)" \
            --privacy "$YOUTUBE_PRIVACY" \
            --thumbnail publish/thumbnail.jpg \
            --result-json publish/youtube-result.json \
            --confirm-upload | tee publish/youtube-result.txt
          test -s publish/youtube-result.json

      - name: Persist publication for learning
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin tubeverse-actions
          git reset --hard origin/tubeverse-actions
          mkdir -p publishing-history
          python - '${{ steps.meta.outputs.job_file }}' publish/youtube-result.json "$GITHUB_RUN_ID" <<'PY'
          import json, pathlib, sys
          job=json.load(open(sys.argv[1]))
          result=json.load(open(sys.argv[2]))
          auto=job.get('autonomy') or {}
          history={
              **result,
              'sourceRunId': job.get('id'),
              'publisherWorkflowRunId': sys.argv[3],
              'niche': auto.get('niche'),
              'angle': auto.get('angle'),
              'hook': auto.get('hook'),
              'format': auto.get('format'),
              'originality': auto.get('originality'),
              'trendSourceVideoIds': auto.get('sourceVideoIds') or [],
          }
          target=pathlib.Path('publishing-history') / f"{result['videoId']}.json"
          target.write_text(json.dumps(history, indent=2, ensure_ascii=False), encoding='utf-8')
          print(target)
          PY
          git config user.name 'TubeAutonomy Publisher'
          git config user.email 'tubeautonomy-publisher@users.noreply.github.com'
          git add publishing-history/*.json
          git commit -m "autonomy: record YouTube publication $(python -c "import json; print(json.load(open('publish/youtube-result.json'))['videoId'])")"
          git push origin HEAD:tubeverse-actions

      - uses: actions/upload-artifact@v4
        with:
          name: youtube-publish-${{ github.run_number }}
          path: |
            publish/thumbnail.jpg
            publish/youtube-result.txt
            publish/youtube-result.json
            ${{ steps.meta.outputs.qa_file }}
          retention-days: 30
