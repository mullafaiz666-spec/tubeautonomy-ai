name: TubeAutonomy Autonomous Content Factory

on:
  push:
    branches: [tubeverse-actions]
    paths:
      - 'autonomy-trigger/**.json'
  schedule:
    # GitHub schedules only execute from the default branch. This remains here
    # for portability; the isolated branch is triggered by the external daily
    # heartbeat instead of modifying main.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      niche:
        description: YouTube niche/topic to research
        required: false
        default: artificial intelligence
      region:
        description: YouTube region code
        required: false
        default: US
      format:
        description: Output format
        required: false
        default: shorts
        type: choice
        options:
          - shorts
          - long

permissions:
  contents: write
  actions: write

concurrency:
  group: tubeautonomy-content-factory
  cancel-in-progress: false

jobs:
  research-write-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      job_file: ${{ steps.result.outputs.job_file }}
      meta_file: ${{ steps.result.outputs.meta_file }}
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      AUTONOMY_NICHE: ${{ inputs.niche || vars.AUTONOMY_NICHE || 'artificial intelligence' }}
      AUTONOMY_REGION: ${{ inputs.region || vars.AUTONOMY_REGION || 'US' }}
      AUTONOMY_FORMAT: ${{ inputs.format || vars.AUTONOMY_FORMAT || 'shorts' }}
      AUTONOMY_LOOKBACK_HOURS: ${{ vars.AUTONOMY_LOOKBACK_HOURS || '72' }}
      AUTONOMY_TOP_VIDEOS: ${{ vars.AUTONOMY_TOP_VIDEOS || '6' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tubeverse-actions
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: autonomy/requirements.txt

      - name: Verify autonomous research credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo 'Missing GEMINI_API_KEY repository secret'; exit 2; }
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo 'YOUTUBE_API_KEY is not configured; yt-dlp public-metadata trend discovery will be used.'
          else
            echo 'Using official YouTube Data API for trend discovery.'
          fi

      - name: Install autonomous agent stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r autonomy/requirements.txt

      - name: Refresh our own channel performance memory
        shell: bash
        run: |
          set -euo pipefail
          if find publishing-history -maxdepth 1 -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            python autonomy/analytics.py --history-dir publishing-history --output learning/channel-performance.json --limit 50
          else
            echo 'No prior autonomous publications yet; writer starts without channel memory.'
          fi

      - name: Scan trends, learn, write and enforce originality
        run: |
          python autonomy/run_factory.py \
            --niche "$AUTONOMY_NICHE" \
            --region "$AUTONOMY_REGION" \
            --format "$AUTONOMY_FORMAT" \
            --lookback-hours "$AUTONOMY_LOOKBACK_HOURS" \
            --top-videos "$AUTONOMY_TOP_VIDEOS" \
            --memory learning/channel-performance.json \
            --result-file autonomy-result.json

      - name: Resolve generated render job
        id: result
        shell: bash
        run: |
          set -euo pipefail
          JOB_FILE="$(python -c "import json; print(json.load(open('autonomy-result.json'))['jobPath'])")"
          META_FILE="$(python -c "import json; print(json.load(open('autonomy-result.json'))['metadataPath'])")"
          test -s "$JOB_FILE"
          test -s "$META_FILE"
          echo "job_file=$JOB_FILE" >> "$GITHUB_OUTPUT"
          echo "meta_file=$META_FILE" >> "$GITHUB_OUTPUT"
          echo "Generated $JOB_FILE"

      - name: Persist autonomy audit and render job
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TubeAutonomy Agent'
          git config user.email 'tubeautonomy-agent@users.noreply.github.com'
          git add '${{ steps.result.outputs.job_file }}' '${{ steps.result.outputs.meta_file }}'
          if [ -f learning/channel-performance.json ]; then git add learning/channel-performance.json; fi
          git commit -m "autonomy: create original render job $(basename '${{ steps.result.outputs.job_file }}')"
          git push origin HEAD:tubeverse-actions

      - uses: actions/upload-artifact@v4
        with:
          name: autonomy-research-${{ github.run_number }}
          path: |
            autonomy-result.json
            ${{ steps.result.outputs.job_file }}
            ${{ steps.result.outputs.meta_file }}
            learning/channel-performance.json
          if-no-files-found: warn
          retention-days: 14

  render-verify-publish:
    needs: research-write-package
    uses: ./.github/workflows/render-tubeverse-video.yml
    with:
      job_file: ${{ needs.research-write-package.outputs.job_file }}
    secrets: inherit
